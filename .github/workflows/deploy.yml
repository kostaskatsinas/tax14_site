name: Deploy TAX14 to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload to Hostinger public_html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.hostinger/**
            SPECS.md
            HOSTINGER_DEPLOY.md
            EMAIL_SETUP.md
            BREVO_SETUP.md
            FINANCIAL_STATEMENTS.md
            config/**
            tests/**
            scripts/**
            design-system/**
            **/.env*
            **/tax14-contact-config.php
            tax14_site.zip
